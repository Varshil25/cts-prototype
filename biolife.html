<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <title>BioLife – CTS Classrooms</title>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-light bg-white border-bottom shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="index.html">CTS Classrooms</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="mainNav" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Buildings</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container container-wide my-4">

  <nav aria-label="breadcrumb" class="mb-1">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="index.html">Buildings</a></li>
      <li class="breadcrumb-item active">BioLife</li>
    </ol>
  </nav>

  <h1 class="section-title">BioLife</h1>

  <div class="row g-4">

    <!-- LEFT: filter bar + rooms grid -->
    <section class="col-12 col-lg-9">

      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <span class="text-muted me-2">Filter:</span>
        <span class="filter-pill" data-wireless="kramer">Kramer</span>
        <span class="filter-pill" data-wireless="apple_tv">Apple&nbsp;TV</span>
        <span class="filter-pill" data-wireless="screenbeam">ScreenBeam</span>
        <span class="filter-pill" data-flag="touchscreen_presentation">Touchscreen Presentation</span>
        <span class="filter-pill" data-flag="web_conference_camera">Zoom Camera</span>
        <span class="filter-pill" data-flag="interactive_display">Interactive display</span>
        <span id="resultsMeta" class="text-muted small ms-2"></span>
        <button id="clearFilters" class="btn btn-sm btn-outline-secondary ms-1" type="button">Clear</button>
        <div class="ms-auto d-flex align-items-center gap-2">
          <label class="text-muted small mb-0">Sort:</label>
          <select id="sortSel" class="form-select form-select-sm" style="width:auto;">
            <option value="">Default</option>
            <option value="cap-asc">Capacity ↑</option>
            <option value="cap-desc">Capacity ↓</option>
            <option value="room-asc">Room # ↑</option>
          </select>
        </div>
      </div>

      <div class="row g-3" id="roomsGrid">

        <!-- Room 113 -->
        <div class="col-12 col-sm-6 col-md-4 col-lg-6 col-xl-4"
             data-capacity="48"
             data-room="113"
             data-wireless="apple_tv,kramer"
             data-touchscreen_presentation="0"
             data-web_conference_camera="0"
             data-interactive_display="1">
          <a class="text-decoration-none text-reset" href="biolife-room.html?room=113">
            <div class="tile h-100">
              <div class="ratio ratio-16x9 bg-light">
                <div class="img-cover d-flex align-items-center justify-content-center text-muted" style="font-size:.85rem;">No preview</div>
              </div>
              <div class="px-3 pb-2 pt-2">
                <div class="room-tile-title">BioLife 113</div>
                <div class="room-tile-sub d-flex justify-content-center gap-2 flex-wrap">
                  <span>Capacity: 48</span>
                </div>
              </div>
            </div>
          </a>
        </div>

        <!-- Room 332 -->
        <div class="col-12 col-sm-6 col-md-4 col-lg-6 col-xl-4"
             data-capacity="49"
             data-room="332"
             data-wireless=""
             data-touchscreen_presentation="0"
             data-web_conference_camera="0"
             data-interactive_display="0">
          <a class="text-decoration-none text-reset" href="biolife-room.html?room=332">
            <div class="tile h-100">
              <div class="ratio ratio-16x9 bg-light">
                <div class="img-cover d-flex align-items-center justify-content-center text-muted" style="font-size:.85rem;">No preview</div>
              </div>
              <div class="px-3 pb-2 pt-2">
                <div class="room-tile-title">BioLife 332</div>
                <div class="room-tile-sub d-flex justify-content-center gap-2 flex-wrap">
                  <span>Capacity: 49</span>
                </div>
              </div>
            </div>
          </a>
        </div>

        <!-- Room 342 -->
        <div class="col-12 col-sm-6 col-md-4 col-lg-6 col-xl-4"
             data-capacity="30"
             data-room="342"
             data-wireless=""
             data-touchscreen_presentation="0"
             data-web_conference_camera="0"
             data-interactive_display="0">
          <a class="text-decoration-none text-reset" href="biolife-room.html?room=342">
            <div class="tile h-100">
              <div class="ratio ratio-16x9 bg-light">
                <div class="img-cover d-flex align-items-center justify-content-center text-muted" style="font-size:.85rem;">No preview</div>
              </div>
              <div class="px-3 pb-2 pt-2">
                <div class="room-tile-title">BioLife 342</div>
                <div class="room-tile-sub d-flex justify-content-center gap-2 flex-wrap">
                  <span>Capacity: 30</span>
                </div>
              </div>
            </div>
          </a>
        </div>

      </div><!-- /roomsGrid -->
    </section>

    <!-- RIGHT: resources sidebar -->
    <aside class="col-12 col-lg-3">
      <div class="sidebar-sticky">
        <h2 class="h5 fw-bold mb-2">Resources</h2>
        <div class="text-muted small">No resources yet.</div>
      </div>
    </aside>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const grid     = document.getElementById('roomsGrid');
  const cards    = Array.from(grid.querySelectorAll('[data-capacity]'));
  const pills    = document.querySelectorAll('.filter-pill');
  const sortSel  = document.getElementById('sortSel');
  const clearBtn = document.getElementById('clearFilters');
  const metaEl   = document.getElementById('resultsMeta');

  const activeWireless = new Set();
  const activeFlags    = new Set();

  pills.forEach(p => {
    p.addEventListener('click', () => {
      p.classList.toggle('active');
      if (p.hasAttribute('data-wireless')) {
        const val = (p.getAttribute('data-wireless') || '').toLowerCase().trim();
        if (p.classList.contains('active')) activeWireless.add(val);
        else activeWireless.delete(val);
      } else if (p.hasAttribute('data-flag')) {
        const flag = p.getAttribute('data-flag').trim();
        if (p.classList.contains('active')) activeFlags.add(flag);
        else activeFlags.delete(flag);
      }
      apply();
    });
  });

  sortSel.addEventListener('change', apply);
  clearBtn.addEventListener('click', () => {
    activeWireless.clear();
    activeFlags.clear();
    pills.forEach(p => p.classList.remove('active'));
    apply();
  });

  function wirelessTokens(card) {
    return (card.getAttribute('data-wireless') || '').toLowerCase()
      .split(',').map(s => s.trim()).filter(Boolean);
  }

  function passesWireless(card) {
    if (!activeWireless.size) return true;
    const tokens = wirelessTokens(card);
    for (const w of activeWireless) if (!tokens.includes(w)) return false;
    return true;
  }

  function passesFlags(card) {
    if (!activeFlags.size) return true;
    for (const f of activeFlags)
      if ((card.getAttribute('data-' + f) || '0') !== '1') return false;
    return true;
  }

  function apply() {
    cards.forEach(c => c.style.display = (passesWireless(c) && passesFlags(c)) ? '' : 'none');
    const mode    = sortSel.value;
    const visible = cards.filter(c => c.style.display !== 'none');
    const hidden  = cards.filter(c => c.style.display === 'none');
    if (metaEl) metaEl.textContent = visible.length + ' shown';
    if (mode) {
      visible.sort((a, b) => {
        if (mode === 'cap-asc')
          return (+a.getAttribute('data-capacity') || 0) - (+b.getAttribute('data-capacity') || 0);
        if (mode === 'cap-desc')
          return (+b.getAttribute('data-capacity') || 0) - (+a.getAttribute('data-capacity') || 0);
        if (mode === 'room-asc')
          return (a.getAttribute('data-room') || '').localeCompare(
            b.getAttribute('data-room') || '', undefined, { numeric: true, sensitivity: 'base' });
        return 0;
      });
    }
    [...visible, ...hidden].forEach(c => grid.appendChild(c));
  }

  const PREVIEW_IMG = {
    '113': 'BioLife/1st Floor/113/AS7A4898.JPG',
    '332': 'BioLife/3rd Floor/332/AS7A4856.JPG',
    '342': 'BioLife/3rd Floor/342/AS7A4871.JPG',
  };
  cards.forEach(c => {
    const rn  = c.getAttribute('data-room');
    const src = PREVIEW_IMG[rn];
    if (!src) return;
    const ratio = c.querySelector('.ratio');
    if (ratio) ratio.innerHTML = `<img class="img-cover" src="${encodeURI(src)}" alt="BioLife ${rn}">`;
  });

  apply();
});
</script>
</body>
</html>
